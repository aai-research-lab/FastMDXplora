# Conda environment for FastMDXplora.
#
# Creates an environment named `fastmdxplora` with the full dependency
# stack, including the molecular-dynamics chemistry tools (OpenMM,
# PDBFixer) that drive the setup and simulation phases. These come from
# conda-forge, where they are reliably packaged across platforms.
#
# Create it with mamba (faster solver) and fall back to conda:
#
#     mamba env create -f environment.yml || conda env create -f environment.yml
#     conda activate fastmdxplora
#     pip install .            # or `pip install -e ".[test]"` for development
#
# The OpenMM/PDBFixer packages are what make conda the recommended route;
# the rest of the stack is pip-installable, so analysis + report also work
# from a plain `pip install fastmdxplora` without this environment.
#
# What "full" means here, exactly: the core requirements and the `md`,
# `ligand`, `amber`, `umap` and `pdf` extras of pyproject.toml -- which is
# `all` plus `pdf` -- together with the three conda-only packages
# (`openmm-plumed`, `openff-toolkit`, `ambertools`) that no extra can
# express. The `validation` extra is deliberately not here: MDAnalysis and
# ProLIF are installed for the cross-tool comparison, where the point is that
# the two stacks are separate.
#
# `test_the_conda_file_installs_what_it_claims` holds this file to that
# sentence. It is not a formality: `markdown` and `umap-learn` were both
# missing from a file whose first paragraph said "full dependency stack", so
# anyone who set up from it got a PDF report that refused to render and a
# UMAP analysis that could not run.
name: fastmdxplora
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  - pip
  # Core (analysis + report)
  # See the note in pyproject.toml: np.trapezoid needs 2.0.
  - numpy>=2.0
  - pyyaml>=6.0
  - mdtraj>=1.9.7
  - matplotlib>=3.5
  - scikit-learn>=1.0
  - pandas>=1.4
  - python-pptx>=0.6.21
  - scipy>=1.7
  - pillow>=10.0
  # Molecular-dynamics chemistry stack (setup + simulation phases)
  - openmm>=8.2
  - pdbfixer
  # Ligand chemistry and protonation. Absent, `resolve_ligand_chemistry`
  # cannot perceive a ligand and pKa assignment cannot run -- so a developer
  # set up from this file had no ligand path at all while the page describing
  # it said they had the whole stack. The floors match pyproject.toml's, so
  # that a conda environment and a pip install are the same software.
  - openmmforcefields>=0.12
  - rdkit>=2023.3
  - propka>=3.5
  - openff-toolkit
  # A ligand's AM1-BCC charges, which the toolkit computes by calling
  # AmberTools' sqm. openff-toolkit no longer brings it, and without it every
  # ligand fails after its system has been solvated.
  - ambertools
  # Enhanced sampling. conda-only, which is the reason this file exists:
  # there is deliberately no `plumed` pip extra, so a clone set up any other
  # way has no umbrella, metadynamics or steered support.
  - openmm-plumed
  # Reading Amber NetCDF trajectories.
  - netcdf4>=1.6
  # Rendering the report as a PDF. Both halves: WeasyPrint lays the page out
  # and `markdown` is what turns the report into the HTML it lays out, so a
  # file carrying only the first produces a PDF phase that refuses.
  - weasyprint>=60
  - markdown>=3.4
  # UMAP, for the dimensionality-reduction analysis that offers it.
  - umap-learn>=0.5
