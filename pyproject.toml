[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmdxplora"
dynamic = ["version"]
description = "FastMDXplora: Fully Automated SysTem for Molecular Dynamics eXploration"
readme = "README.md"
# 3.14 is held back by PROPKA, not by this tree: see the ceiling
# comment in .github/workflows/tests.yml.
requires-python = ">=3.9, <3.14"
license = { text = "MIT" }
authors = [
    { name = "Adekunle Aina" },
    { name = "Derrick Kwan" },
]
maintainers = [
    { name = "Adekunle Aina" },
]
keywords = [
    "molecular-dynamics",
    "md-simulation",
    "trajectory-analysis",
    "automation",
    "orchestrator",
    "computational-chemistry",
    "biophysics",
    "structural-biology",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # np.trapezoid (simulation/binding.py) is the NumPy 2.0 rename of
    # np.trapz and does not exist on 1.x, so binding_free_energy() raised
    # AttributeError across most of the range this floor used to claim.
    # CI cannot catch a floor: all nine legs resolve the newest NumPy.
    "numpy>=2.0",
    "pyyaml>=6.0",
    "mdtraj>=1.9.7",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "pandas>=1.4",
    "python-pptx>=0.6.21",
    # Used directly to size figures on slides. python-pptx happens to require
    # it, but relying on another package's dependency is how a working install
    # becomes a broken one after an upstream release.
    "pillow>=10.0",
]

[project.optional-dependencies]
# Driving the package from a program that writes configs. Deliberately
# thin: the agent takes a completion function from its caller, so no model
# client and no HTTP stack is required here. The extra exists so that
# `fastmdxplora[agent]` is a documented thing to install rather than a
# folder people find, and so it has somewhere to grow.
agent = []

# Rendering the report as a PDF. WeasyPrint needs Pango and Cairo as system
# libraries on PyPI; the conda-forge package brings its own, which is why the
# conda distribution is the easier route.
pdf = [
    "weasyprint>=60",
    "markdown>=3.4",
]
md = [
    "pdbfixer",
    # pdbfixer 1.12 itself requires >=8.2, so stating >=8.0 here was a floor
    # below the real one -- and on a platform with no OpenMM wheel at all,
    # pip reports the pair as a "conflict", which buries the actual problem
    # (no distribution) under a spurious one (the ranges).
    "openmm>=8.2",
]
ligand = [
    # openff-toolkit is deliberately absent, and this extra is smaller than
    # the ligand path needs because of it: the toolkit has no PyPI
    # distribution at all, so naming it here made `pip install
    # "fastmdxplora[ligand]"` fail outright rather than install what pip can.
    # A command that cannot succeed is worse than one that installs part of
    # the answer and says what is left.
    #
    # The conda-forge package carries the whole path, which is what that
    # distribution is for. See the installation guide.
    "openmmforcefields>=0.12",
    # Used directly to read chemical definitions and detect ionizable groups.
    # It arrives with openff-toolkit in practice, but the dependency is real
    # and belongs here rather than being inherited by accident.
    "rdkit>=2023.3",
    # Determines a ligand's pKa in the complex rather than in isolation, which
    # is the only framing in which the question has a well-defined answer.
    "propka>=3.5",
]
# AMBER NetCDF trajectories load through scipy without this, with a warning
# that the path is slower. netCDF4 provides the fast reader.
amber = [
    "netCDF4>=1.6",
]
# UMAP is one of three dimensionality-reduction methods and the only one
# needing a package of its own.
umap = [
    "umap-learn>=0.5",
]
# There is deliberately no `plumed` extra. Enhanced sampling needs
# openmm-plumed, which has no PyPI distribution at all -- it is a conda-forge
# package -- so naming it in an extra did not make it reachable: it made
# `pip install "fastmdxplora[plumed]"` fail to resolve, the same way the
# ligand extra did before 2.3.0. It is declared in the conda recipe, which is
# where it can be had, and the import raises with that instruction.
# The independent implementations the cross-tool comparison measures
# agreement against. Deliberately outside `all`: shipping the reference
# alongside the thing it checks would make the two travel together, and a
# comparison against a tool that arrives with the software is not the
# independent check it is presented as.
validation = [
    "MDAnalysis>=2.7",
    "prolif>=2.0",
]
all = [
    # No `plumed` here. The comment fifteen lines up says there is
    # deliberately no `plumed` extra; naming it anyway made pip print
    # "does not provide the extra 'plumed'" and carry on, so `[all]`
    # resolved without it and installed silently with no PLUMED support.
    # A warning nobody reads is the same as no warning.
    "fastmdxplora[md,ligand,amber,umap]",
]
test = [
    # A test asserts the lint gate is clean, so the linter is part of
    # running the tests. It was in [dev] alone, which meant that test
    # raised FileNotFoundError in every environment installed the way
    # the docs describe -- including CI's own test job.
    "ruff>=0.5.0",
    # Four tests read this file, and `tomllib` is stdlib only from 3.11
    # while requires-python starts at 3.9. `tomli` is the same parser
    # under its pre-stdlib name. Not skipping below 3.11: that would have
    # hidden those four on two of the five supported versions, and a skip
    # is invisible in a green run -- the same reasoning as RDKit below.
    # The import is made once, in tests/_toml.py.
    "tomli>=2.0; python_version < '3.11'",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # The suite may fail; it may not hang. A per-test ceiling turns a wall
    # into a named red test with every thread's stack attached.
    "pytest-timeout>=2.1",
    # Unlike the rest of the ligand extra, RDKit has a PyPI wheel -- the
    # openff-toolkit is what keeps that extra off PyPI, not this. Without it
    # here, every chemistry-dependent test skips on CI, and the interaction
    # rules -- the code that tells a report what holds a ligand -- read as
    # covered at 85% while their geometric criteria had never once been
    # exercised. Forty tests skipped silently; a skip is invisible in a
    # green run.
    "rdkit>=2023.3",
    # Same reasoning, same wheel situation: PROPKA is pure Python on PyPI,
    # and without it every protonation-settling test skips where coverage is
    # measured.
    "propka>=3.5",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.1",
    "rdkit>=2023.3",
    "propka>=3.5",
    "ruff>=0.5.0",
    "python-pptx>=0.6.21",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/aai-research-lab/FastMDXplora"
Documentation = "https://fastmdxplora.readthedocs.io/en/latest/"
Repository = "https://github.com/aai-research-lab/FastMDXplora"
Issues = "https://github.com/aai-research-lab/FastMDXplora/issues"
Changelog = "https://github.com/aai-research-lab/FastMDXplora/blob/main/CHANGELOG.md"

[project.scripts]
fastmdx = "fastmdxplora.cli.main:main"
fastmdxplora = "fastmdxplora.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastmdxplora = [
    "gui/static/*",
    "gui/static/**/*",
    "gui/templates/*.html",
    "gui/templates/**/*",
]

[tool.setuptools_scm]
write_to = "src/fastmdxplora/_version.py"
# Not a plausible version number, on purpose. This is only reached where
# there is no tag and no written `_version.py` -- a build that cannot know
# what it is -- and a fallback that looks like a real release makes that
# build indistinguishable from a real one. `0.1.0` sat here while the
# project shipped 2.5.5, and Read the Docs published it.
fallback_version = "0.0.0+unknown-version"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
