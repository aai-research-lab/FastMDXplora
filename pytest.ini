[pytest]
testpaths = tests packages/fastmdxplora-membrane/tests
python_files = test_*.py
# A hanging test is a silent six-hour squat on a CI runner; the wall at
# the first parallel batch test wore that disguise for two days. Ten
# minutes is generous for any single test in this suite, and the thread
# method dumps every stack so the wall is named where it stands.
addopts = -v --tb=short -m "not network" --timeout=600 --timeout-method=thread
markers =
    network: needs internet access; deselected by default, run with -m network
    slow: runs dynamics, so seconds rather than milliseconds
filterwarnings =
    ignore::DeprecationWarning:fastmdx
