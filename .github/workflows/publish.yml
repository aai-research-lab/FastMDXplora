name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build the canonical package (fastmdxplora)
        run: python -m build

      - name: Build the fastmdx alias
        run: cd shim-package && python -m build

      # The bilayer analyses, which fastmdxplora requires: released with it,
      # from the same tag.
      - name: Build fastmdxplora-membrane
        run: cd packages/fastmdxplora-membrane && python -m build

      - name: Verify fastmdxplora-membrane's version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(ls packages/fastmdxplora-membrane/dist/fastmdxplora_membrane-*.whl \
                | head -1 | sed -E 's|.*/fastmdxplora_membrane-([^-]+)-.*|\1|')
          echo "fastmdxplora-membrane version: $VER (tag: $TAG)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::fastmdxplora-membrane version ($VER) does not match release tag ($TAG). It takes its version from the tag through setuptools-scm -- check that the checkout used fetch-depth: 0 and that the tag is on the commit being built."
            exit 1
          fi

      - name: Verify fastmdx alias version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # From the built wheel, not from pyproject.toml. The alias takes
          # its version from the git tag now, so there is no literal there to
          # read -- and the thing worth checking was always what was built
          # rather than what was written down.
          VER=$(ls shim-package/dist/fastmdx-*.whl \
                | head -1 | sed -E 's|.*/fastmdx-([^-]+)-.*|\1|')
          echo "fastmdx version: $VER (tag: $TAG)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::fastmdx alias version ($VER) does not match release tag ($TAG). The alias takes its version from the tag through setuptools-scm, so there is nothing in shim-package/pyproject.toml to bump -- check that the checkout used fetch-depth: 0 and that the tag is on the commit being built."
            exit 1
          fi

      - name: Upload fastmdxplora artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-fastmdxplora
          path: dist/

      - name: Upload fastmdx artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-fastmdx
          path: shim-package/dist/

      - name: Upload fastmdxplora-membrane artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-fastmdxplora-membrane
          path: packages/fastmdxplora-membrane/dist/

  # Before fastmdxplora, which requires it: a `pip install fastmdxplora` in
  # the minutes between the two would otherwise find no fastmdxplora-membrane
  # to install.
  publish-fastmdxplora-membrane:
    name: Publish fastmdxplora-membrane to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist-fastmdxplora-membrane
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-fastmdxplora:
    name: Publish fastmdxplora to PyPI
    needs: publish-fastmdxplora-membrane
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist-fastmdxplora
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-fastmdx:
    name: Publish fastmdx (alias) to PyPI
    needs: publish-fastmdxplora
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist-fastmdx
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
