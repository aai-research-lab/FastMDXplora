name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:00 UTC daily, for the corpus job below.
    - cron: "0 3 * * *"
  workflow_dispatch:

# A push superseding another cancels its run. Fifteen jobs per push against
# a twenty-job account ceiling meant an afternoon of pushes queued for hours
# behind runs whose commits were already history -- and the one hand-canceled
# run read as a mystery failure until the workflow was read closely.
#
# Grouped by event as well. With the branch alone, `git push && gh workflow
# run` cancelled the push's run with the dispatch it had just asked for, and
# a push near 03:00 cancelled the nightly corpus run. A run now supersedes
# only a run of its own kind.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The corpus that finds what the suite does not.
  #
  # `pytest.ini` deselects `-m "not network"` by default and the job below
  # runs bare `pytest`, so the 105 network-marked tests -- the whole
  # structure corpus and the method-produces-its-result suite -- ran nowhere:
  # not in CI, not in the documented contributor workflow, which says only
  # "run the test suite". `tests/validation/structures.py` opens by saying
  # every defect found on 2026-08-07 was found by running a real structure
  # "not by the test suite, which was green at 1,900 tests throughout", and
  # the 2026-09-04 audit was another instance of that sentence.
  #
  # Nightly rather than per-push because it fetches from RCSB and runs real
  # dynamics, and `workflow_dispatch` so it can be asked for before a
  # release. It does not gate a pull request: a corpus that fetches from the
  # network will go red for reasons that are not the contributor's, and a
  # required check that does that gets ignored or removed.
  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 90 was reached exactly, at 90% of the corpus, on 2026-09-06 -- and 70 of
    # those minutes were one structure prepared seven times because a failed
    # preparation was not cached. With that fixed the run is about 40 minutes;
    # this leaves room for a slow fetch without leaving room for a silent hang.
    timeout-minutes: 120
    # conda, not pip, and the reason is in `environment.yml`'s own comments.
    # Two capabilities in this corpus have no wheel at all:
    #
    #   openmm-plumed  -- "conda-only, which is the reason this file exists:
    #                     there is deliberately no `plumed` pip extra, so a
    #                     clone set up any other way has no umbrella,
    #                     metadynamics or steered support."
    #   openff-toolkit -- `fastmdx doctor` prints, in every job that has run:
    #                     "OpenFF toolkit  missing  conda install -c
    #                     conda-forge openff-toolkit"
    #
    # Installed by pip, this job ran the corpus with no enhanced sampling and
    # no ligand chemistry, so `test_it_runs` refused for umbrella,
    # metadynamics and steered, and the ligand structure refused too -- four
    # clean, correct refusals that read as four defects. An extras group pip
    # can satisfy is not the same thing as an environment the physics can run
    # in, and only `environment.yml` describes the second.
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The declared stack, from the file the package already ships and that
      # `test_the_stack_is_actually_there` already checks against.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          # [validation] brings MDAnalysis and ProLIF, which no job has ever
          # installed -- so `validation/cross_tool.py`, 853 lines of genuine
          # independent comparison with pre-registered tolerances, has never
          # been executed by CI either. From conda-forge here so pip does not
          # resolve numpy or scipy over the build openmm was compiled for.
          create-args: >-
            mdanalysis>=2.10
            prolif>=2.2
            pytest
            pytest-timeout
            pytest-cov

      - name: Install FastMDXplora without re-resolving the stack
        run: python -m pip install -e . --no-deps

      # State the environment rather than leaving it to be inferred from
      # which tests failed. Four hours were spent reading a failure whose
      # cause this command prints in one line.
      - name: What this environment actually has
        run: fastmdx info

      # `--timeout-method=signal` fails the hung test instead of killing the
      # session. On 2026-09-06 one structure hung for the full 600 s and took
      # the whole report with it: no failure section, no summary, nothing for
      # the other hundred tests. A corpus that fetches real structures will
      # meet a slow one, and it should cost that one test.
      # Before the corpus, because it takes eight seconds and the corpus
      # takes an hour. These are the tests that need a real OpenMM: the
      # seeding path opens a trajectory, builds a context and writes a
      # `state.xml`, none of which the pip-installed matrix legs can do.
      # It was 44% of a diff and it held both bugs that reached a real run.
      - name: Run the tests that need a real OpenMM
        run: pytest tests/test_seeding_end_to_end.py -v --timeout-method=signal --timeout=600

      # The network-marked tests outside the corpus: a PDB ID fetched through
      # the command line, and PROPKA on a real complex. The step below runs
      # tests/validation only, so these ran in no job at all.
      - name: Run the other network-marked tests
        run: pytest -m network tests --ignore=tests/validation -v --timeout-method=signal --timeout=600

      - name: Run the network-marked corpus
        run: pytest -m network tests/validation -v --timeout-method=signal --timeout=2400

  test:
    runs-on: ${{ matrix.os }}
    # A hung leg otherwise holds a runner for the six-hour default, which
    # during a pileup is a fifth of the account's whole capacity. The
    # coverage leg runs the same tests traced, about twice as long, and
    # was cancelled at 99% under the 45 minutes the others take. With the
    # browser tests it took 86 minutes at 0bcdf122 and was cancelled at 90
    # in run #729. The macOS legs took 35-52 minutes on 10-21 and, with
    # the arm64 runners short of capacity, two were cancelled at 83% and
    # 86% at 60 with nothing failed: 90 for them. The other ubuntu legs
    # took 47-57 minutes on 10-25, and on 10-26 two were cancelled at 60,
    # at 51% and 97%, with nothing failed: 90 for them too. The coverage
    # leg took 138 minutes on 10-25 and on 10-26 was cancelled at 150 at 97%
    # of its browser tests, its ffmpeg alone taking 9 minutes: 180 for it.
    # Those times were on ubuntu 3.11; the coverage leg is ubuntu 3.13 since
    # 10-28 (the reason is at "Run tests") and keeps the 180.
    # In run 42699335287 on 11-09 the plain legs, the suite on one core,
    # took 50 minutes (ubuntu 3.10), 49 (macOS 3.10) and 89 (macOS 3.13,
    # 55 seconds under its 90), and ubuntu 3.11 and macOS 3.11 were
    # cancelled at 90 with nothing failed; the coverage leg took 139. The
    # plain legs now run as the coverage leg does, but their browser files
    # one at a time (see "Run tests"), and 120 is a margin for a macOS
    # runner short of capacity, not room for the suite to grow back into.
    # A hung test does not wait for it. On every core pytest-timeout fails
    # it at 600 seconds by a signal, with
    # its stack, and the next test runs; its own thread method ends the
    # worker, and xdist ran the test again on each new one, 17 times on four
    # cores, with no stack shown. The signal fires once: a test whose
    # cleanup then waits on what hung (a `finally` that shuts down a pool
    # whose worker never answers) holds its worker still, so at 660 seconds
    # faulthandler writes every thread's stack, the test's own line among
    # them, and ends the worker. A worker that crashes or is ended ends the
    # run on every core, naming its test, rather than being replaced, and
    # the tests not yet run there are not counted. Run one at a time, the
    # thread method ends the run at 600 seconds with every thread's stack.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS are what FastMDXplora supports. AmberTools, which
        # gives every ligand its charges, has no Windows build.
        os: [ubuntu-latest, macos-latest]
        # The floor, the middle, and the ceiling: 3.10 keeps the `>=3.10`
        # claim honest, 3.11 is a plain leg like the others, and the
        # ceiling is where what is coming breaks first. Ubuntu at the
        # ceiling is the coverage leg, the one job codecov reads; it moves
        # with the ceiling only to a version sys.monitoring can measure
        # (see "Run tests"). The floor was
        # 3.9 until OpenMM stopped publishing wheels for it, which made
        # every 3.9 job the one without the physics; that role is kept on
        # purpose below, on the floor. The versions in between are bracketed --
        # nothing in the tree branches on the interpreter version, so a
        # suite green at both ends is green in the middle.
        #
        # The ceiling moves rather than a fourth leg being added: every
        # version is a job on each operating system, against a twenty-job
        # account ceiling, and a pileup of those is what the concurrency
        # rule above exists to prevent.
        #
        # It sat briefly at 3.14 and came back. Every distribution here
        # publishes cp314 wheels, which is what was checked beforehand and
        # was the wrong question: PROPKA installs on 3.14 and then raises
        # at runtime. `propka/parameters.py` reads `self.__annotations__`,
        # an instance lookup that resolved to the class dict through 3.13
        # and does not under PEP 649, where class annotations are computed
        # lazily through `__annotate__`. Latest is 3.5.1, it declares
        # `>=3.8` with no upper bound, and no fix has been released.
        #
        # PROPKA is a run dependency of the conda package -- the install
        # route the README leads with -- so `requires-python` cannot claim
        # 3.14 while pKa assignment raises on it. Move the ceiling when
        # PROPKA ships a release that runs there; a wheel existing is not
        # evidence that it does.
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for setuptools-scm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # The [test] and [md] wheels together are hundreds of megabytes --
          # rdkit, OpenMM, mdtraj -- and fifteen jobs re-downloaded all of
          # it on every push.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # pytest-xdist runs the tests that drive no browser on every core
          # (see "Run tests"); a test tool for CI, so it is not in [test].
          # pytest 9 is the first with `faulthandler_exit_on_timeout`, which
          # that run sets; an older pytest would only warn that it is unknown.
          python -m pip install -e ".[test]" pytest-xdist "pytest>=9"
          # The physics too, except on the floor. Without OpenMM the suite
          # skips everything that touches it, and for three rounds "low
          # coverage" meant "the dependency was silently absent where
          # coverage was measured"; the ubuntu 3.13 job carries it and is the
          # one codecov reads. The floor job stays without it on purpose: a
          # base install with no physics is what an analysis-only user
          # has, and the jobs that lacked OpenMM were the ones that found
          # an unguarded import, a missing markdown fallback and a launch
          # that never checked its stack. Best-effort elsewhere: a job that
          # cannot install it skips those tests. Coverage is measured and
          # uploaded from the ubuntu 3.13 job only, not merged across jobs.
          if [ "${{ matrix.python-version }}" = "3.10" ]; then echo "::notice::the floor job runs the base install, without the [md] extra, on purpose"; else
          python -m pip install -e ".[md]" || echo "::notice::the [md] extra has no wheels here; physics-dependent tests will skip"
          fi

      - name: Install ffmpeg for the movie tests
        # The GUI makes a movie with the ffmpeg of the computer it runs on,
        # and is never given one. It was put in the corpus job's
        # environment, which runs no movie test, so here every test that
        # encodes a real movie skipped and coverage read the encoding as
        # untested. The pipeline itself is tested against a stand-in ffmpeg
        # on every job; these run the real one, on Linux, where it installs
        # in seconds.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Install a browser for the GUI tests
        # The GUI is a web page, and what its scripts do can only be checked
        # in a browser: the composer's layout, the study frame, what the run
        # builder submits. Those tests drive Chromium through Playwright and
        # skip where it is absent, which was every job here, so they had only
        # ever run on machines that happened to have it. One job holds them,
        # the one coverage is measured on, ubuntu 3.13. Ubuntu 3.11 runs no
        # browser test since 10-28: they skip there, as on every other leg.
        # A test tool, not a dependency:
        # nobody installing FastMDXplora gets it. poppler-utils gives
        # pdftotext, which reads back the Report printed to a PDF; without it
        # that test skipped.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq poppler-utils
          command -v pdftotext

      - name: Run tests
        # Coverage is measured where it is uploaded and nowhere else. The
        # tracer taxes every line of every test, and fourteen of the fifteen
        # term-missing tables were written into logs nobody reads while the
        # upload step below only ever sends the ubuntu-3.13 file. The other
        # legs exist to prove the suite passes there, and they prove it
        # faster untraced.
        #
        # Measured on 3.13 with sys.monitoring (PEP 669), not on 3.11 with a
        # trace function. On 3.11 coverage installs a trace function in each
        # new thread through `threading.settrace`, and that raised "Cannot
        # install a trace function while another trace function is being
        # installed" as the GUI server's request thread started, so a page
        # never loaded (`Page.goto` timeout), at 31b7da54 and in the run
        # before it. sys.monitoring is set once for the whole
        # interpreter and installs nothing per thread. coverage measures
        # with it only for line coverage on 3.12 and 3.13 (branch coverage
        # needs 3.14) and falls back to its trace function with a warning
        # for any setting it does not support, so the run writes which core
        # it used to a debug file and fails if that was not sys.monitoring.
        shell: bash
        run: |
          # -rfEs lists each failed test, each error and each skipped test
          # with its reason, so a red job names what failed and a program or
          # a package missing from a job is read here rather than inferred
          # from a coverage report.
          #
          # The coverage leg runs the browser tests too, traced, and grew
          # past its 150 minutes: from 82 at 1094e1c9 (10-16) to past 145 by
          # 10-18, cancelled at about 78% on every push since, so main read
          # red on all of them. The tests that drive no browser run on every
          # core of the runner (pytest-xdist, a file's tests on one worker);
          # the files that drive Chromium run after them, two at a time
          # (below), not on every core: four browsers on the runner's four
          # cores, traced, timed out on waits that pass alone (16 of them in
          # the first try, on #65). A file drives Chromium if it names
          # Playwright, or opens a page or takes a browser from a fixture it
          # imports from another.
          # pytest-cov appends the second run to the first.
          #
          # The plain legs run as the coverage leg does since 11-09,
          # untraced, but their browser files one at a time (below). On one
          # core they took up to 89 minutes and two were cancelled at 90
          # (the timings are at `timeout-minutes`). Only the browser tests
          # skip there, Playwright being absent: the other tests of the
          # browser files, about 2,000, still run one at a time after the
          # rest, 7 to 8 minutes on one core. One browser test made the
          # whole of test_a_failed_round_is_said_failed.py, its stop tests
          # in real processes, one of these files, about 23 minutes on one
          # core; it has a file of its own now. Nothing outside these files
          # assumes a serial run: each process takes its own settings and
          # cache folders and each test its own settings (tests/conftest.py),
          # a server is given a free port (port 0), and the clustering tests
          # read a peak in a child process of their own (VmHWM) or from
          # tracemalloc, which counts the process's allocations while the
          # test runs, one test at a time on each worker. The coverage leg
          # already runs them so.
          #
          # On the coverage leg the browser files run on two workers, a
          # file's tests on one, two browsers on the runner's four cores, so
          # each browser and its test process have a core apiece. One at a
          # time they took 1 h 56 min (3,746 passed) after 23 min on every
          # core in run 42759782805: 139 of its 180 minutes before the
          # installs. Two hundred files share out evenly between two
          # workers. The plain legs, whose browser tests skip, run those
          # files one at a time still, in 7 to 8 minutes.
          #
          # `--timeout-method=signal`, the faulthandler options and
          # `--max-worker-restart=0` are why a hang on every core fails once
          # and is named (see `timeout-minutes`).
          parallel="-n auto --dist loadfile --timeout-method=signal --max-worker-restart=0"
          parallel="$parallel -o faulthandler_timeout=660 -o faulthandler_exit_on_timeout=true"
          two="-n 2 ${parallel#-n auto }"
          browser=$(grep -lE 'playwright|\.goto\(|new_page\(|^def test_[a-z0-9_]+\([^)]*\bbrowser\b' tests/*.py || true)
          if [ -z "$browser" ]; then
            echo "::error::no file in tests/ matched the browser grep in Run tests (grep says above if a file could not be read); the grep needs updating"
            exit 1
          fi
          status=0
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.13" ]; then
            export COVERAGE_CORE=sysmon COVERAGE_DEBUG=sys
            export COVERAGE_DEBUG_FILE="$RUNNER_TEMP/coverage-debug.txt"
            pytest -rfEs $parallel --cov=fastmdxplora --cov-report= \
              $(printf -- '--ignore=%s ' $browser) || status=1
            pytest -rfEs $two --cov=fastmdxplora --cov-append \
              --cov-report=term-missing --cov-report=xml $browser || status=1
            grep -E '^ *core: ' "$COVERAGE_DEBUG_FILE" | sort | uniq -c || true
            if grep -qE '^ *core: (CTracer|PyTracer)' "$COVERAGE_DEBUG_FILE" || \
               ! grep -qE '^ *core: SysMonitor' "$COVERAGE_DEBUG_FILE"; then
              echo "::error::coverage did not measure with sys.monitoring; its warning is near the top of this step's log"
              status=1
            fi
          else
            pytest -rfEs $parallel \
              $(printf -- '--ignore=%s ' $browser) || status=1
            pytest -rfEs $browser || status=1
          fi
          exit $status

      - name: Lint
        # CONTRIBUTING has required this since before there was a job for it,
        # which is how 474 findings accumulated -- three of them an undefined
        # name, one a dict literal whose earlier value could never take
        # effect, and three of them a test function defined twice in one file
        # so that the earlier one never ran.
        #
        # Gated on F and B only, and the reason is in pyproject: the E, W, I
        # and UP backlog is 350 findings of import order and line length that
        # would have to be cleared in one 138-file commit before this job
        # could go green, and holding the bug-finding rules hostage to that is
        # how a lint job ends up permanently disabled. `ruff check src tests`
        # still reports everything, and CONTRIBUTING says which subset must
        # pass.
        #
        # One OS and one version: lint findings do not vary by platform, and
        # fifteen copies of the same answer is fifteen runner-minutes. On the
        # coverage leg, with the rest of what one job alone carries.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: ruff check src tests --select F,B

      - name: CLI smoke test
        shell: bash
        run: |
          fastmdx --version
          fastmdx info
          fastmdx --cite

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
