[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmdx"
# From the git tag, like the package it aliases. Hardcoded, it could only
# ever disagree -- and the only thing that noticed was a guard in the publish
# workflow, which fires after the tag has been pushed and the release has
# already failed.
dynamic = ["version"]
description = "Alias for FastMDXplora; installs the canonical 'fastmdxplora' package."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Adekunle Aina" },
    { name = "Derrick Kwan" },
]
keywords = ["fastmdxplora", "fastmdx", "molecular-dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "fastmdxplora>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/aai-research-lab/FastMDXplora"
Repository = "https://github.com/aai-research-lab/FastMDXplora"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# The tag lives in the repository above this directory.
root = ".."
fallback_version = "0.0.0"
