# The demo study shipped with FastMDXplora: trypsin with benzamidine (3PTB),
# the papers' own system. Run on a GPU, then packaged with
# `python scripts/make_demo.py <the finished study>`, which keeps 100 frames
# of the production without water.
systems:
  - system: 3PTB
setup:
  forcefield: amber-openff
  ligand_name: BEN
simulation:
  duration_ns: 10
  timestep_fs: 2.0
  # 10 ns at 2 fs is 5,000,000 steps: a frame every 100 ps, 100 frames.
  trajectory_interval_steps: 50000
  save_selection: not water
